# Fork-only measurement harness (agarg21/ci-agent campaign 117). Upstream: embabel/embabel-agent maven.yml `build` job.
# Differences from upstream: workflow_dispatch only; detect-changes/build-fork/trigger-docs/notify jobs removed;
# `sonar:sonar` goal dropped (fork has no SONAR_TOKEN). Everything else as upstream.
name: Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Configure Testcontainers (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "testcontainers.reuse.enable=true" > $env:USERPROFILE\.testcontainers.properties
      - name: Build and test
        env:
          SKIP_TESTCONTAINER_TESTS: true  # Do not run TestContainer Tests in Windows Matrix Build.
        run: mvn -U -B test verify
      - name: Linux-specific setup and SonarCloud analysis
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Configure Testcontainers for Linux
          mkdir -p /home/runner
          echo "testcontainers.reuse.enable=true" > /home/runner/.testcontainers.properties
          # Run SonarCloud analysis (harness: sonar:sonar goal dropped, no SONAR_TOKEN in the fork)
          mvn -P jacoco-code-coverage -B verify
